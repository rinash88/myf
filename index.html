html,body{height:100%}
body{margin:0;background:var(--ground);color:var(--ink);font:15px/1.45 'Onest',system-ui,-apple-system,'Segoe UI',sans-serif}
button,input{font:inherit;color:inherit}
button{cursor:pointer;-webkit-tap-highlight-color:transparent}
button:focus-visible,input:focus-visible{outline:3px solid #7FC99A;outline-offset:2px}
button:disabled{opacity:.45;cursor:not-allowed}
.wrap{display:flex;gap:44px;align-items:flex-start;justify-content:center;padding-block:28px;padding-inline:24px;min-height:100%}

.iconbtn{width:44px;height:44px;border-radius:22px;border:0;background:var(--card);display:flex;align-items:center;justify-content:center;padding:0}
.scroll{flex:1;overflow-y:auto;padding:6px 14px 24px;display:flex;flex-direction:column;gap:12px}
.card{background:var(--card);border-radius:20px;padding:16px;display:flex;flex-direction:column;gap:10px;border:0;text-align:left}
.card.tap:hover{box-shadow:0 0 0 2px var(--green) inset}
.hero{background:var(--dark);color:#fff;border-radius:24px;padding:24px 20px;display:flex;flex-direction:column;gap:14px}
.hero h2{font-size:30px;line-height:1.1;margin:0;font-weight:800;text-wrap:balance}
.hero p{margin:0;color:#D0D5D9}
.field{height:58px;border-radius:16px;border:2px solid var(--green2);background:#fff;padding:0 16px;font-size:18px;color:var(--ink);width:100%}
.btn{height:52px;border-radius:26px;border:0;background:var(--green);color:#fff;font-size:16px;font-weight:700;padding:0 20px;width:100%}
.btn.bright{background:var(--green2)}

.btn.outline{background:var(--card);color:var(--green);border:2px solid var(--green)}
.btn.sm{height:44px;width:auto;font-size:14px;padding:0 16px}
.btn.white{background:#fff;color:var(--green)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{height:44px;padding:0 14px;border-radius:22px;border:1px solid var(--line);background:var(--card);font-size:14px;font-weight:500}
.chip.on{background:var(--dark);color:#fff;border-color:var(--dark)}
.hint{font-size:13px;color:var(--muted);margin:0}
.eyebrow{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--green)}
.h3{font-size:17px;font-weight:800;margin:0}
.score{background:var(--dark);color:#fff;border-radius:24px;padding:22px 18px;display:flex;flex-direction:column;align-items:center;text-align:center;gap:6px}
.score .big{font-size:78px;font-weight:800;line-height:1;margin-top:4px;font-variant-numeric:tabular-nums}
.pills{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-top:8px}
.pill{font-size:13px;font-weight:700;padding:7px 12px;border-radius:14px}
.bars{display:flex;align-items:flex-end;gap:6px;height:124px}
.bar{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:4px;height:124px;font-variant-numeric:tabular-nums}
.bar i{display:block;width:100%;border-radius:4px 4px 0 0}
.bar small{font-size:11px;color:var(--muted)}
.bar em{font-style:normal;font-size:10px;font-weight:600;color:var(--ink2)}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px}
.track{height:8px;border-radius:4px;background:#E2E6E0;overflow:hidden}
.track i{display:block;height:8px;transition:width .5s ease}
.tags{display:flex;flex-wrap:wrap;gap:6px}
.tag{font-size:12px;font-weight:600;padding:5px 10px;border-radius:12px;background:#EDF0EB;white-space:nowrap}
.tag.g{background:var(--greenSoft);color:#0E5C2F}
.tag.r{background:var(--redSoft);color:var(--red)}
.tag.a{background:var(--amberSoft);color:var(--amber)}
.tag.b{background:var(--blueSoft);color:var(--blue)}

.toggle{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid #ECEFEA}
.toggle:last-child{border-bottom:0}
.sw{width:52px;height:32px;border-radius:16px;border:0;background:#CDD3CB;position:relative;flex-shrink:0;padding:0}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:26px;height:26px;border-radius:13px;background:#fff;transition:left .2s}
.sw.on{background:var(--green2)}
.sw.on::after{left:23px}
.tabs{flex-shrink:0;display:grid;grid-template-columns:repeat(5,1fr);background:#fff;border-top:1px solid #E3E7E1;padding:6px 4px 10px}
.tabs button{border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;font-weight:600;color:var(--muted);padding:6px 0;position:relative}
.tabs button.on{color:var(--green)}
.tabs button .dotb{position:absolute;top:4px;right:calc(50% - 16px);width:8px;height:8px;border-radius:4px;background:var(--red)}
.push{position:absolute;top:10px;left:10px;right:10px;background:#fff;border-radius:22px;padding:14px 16px;box-shadow:0 14px 34px rgba(20,23,26,.3);display:flex;flex-direction:column;gap:6px;animation:drop .35s ease-out;z-index:6}

.toast b{color:#7EDB9C}
@keyframes drop{from{transform:translateY(-20px);opacity:.4}to{transform:none;opacity:1}}
@keyframes pop{from{transform:translate(-50%,10px);opacity:0}to{transform:translate(-50%,0);opacity:1}}

  tasks:r[5].split(';').map(x=>{const p=x.split(':');return {name:p[0], w:+p[1]};}),
  targets:r[6].split(',').map(x=>{const p=x.split(':');return {key:p[0], fit:+p[1]};}),
  course:r[7], price:r[8], pay:r[9], demand:r[10] }; });
const POPULAR=['buh','call','prog','teach','driver','jur','oper','dizg','copy','doc'];
const SALARY=98400, EXPENSES=60000, LESSONS=8;

const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const norm=t=>String(t||'').toLowerCase().replace(/ё/g,'е').trim();
const fmt=n=>Math.round(n).toLocaleString('ru-RU')+' ₽';
const plural=(n,a,b,c)=>{const m10=n%10,m100=n%100;if(m10===1&&m100!==11)return a;if(m10>=2&&m10<=4&&(m100<10||m100>=20))return b;return c;};
const MON=['янв','фев','мар','апр','май','июн','июл','авг','сен','окт','ноя','дек'];
const monthLabel=off=>{const a=9+off;return MON[a%12]+' '+(2026+Math.floor(a/12));};
const riskCol=p=>p>=60?'var(--red)':(p>=25?'var(--amber)':'var(--green)');
const riskTag=p=>p>=60?'r':(p>=25?'a':'g');

function match(q){const n=norm(q);if(n.length<2)return[];return Object.keys(O).filter(k=>{const o=O[k];if(norm(o.name).indexOf(n)>=0)return true;return o.kw.some(w=>{const nw=norm(w);return n.indexOf(nw)>=0||(n.length>=4&&nw.indexOf(n)>=0);});});}
function risk(o,bump){const e=Math.min(0.95,o.e+(bump||0));const t50=1.5+(1-e)*14/o.s;const pmax=Math.min(0.95,0.35+e*0.65);const P=t=>pmax/(1+Math.exp(-0.65*(t-t50)));const bars=[];for(let y=2027;y<=2036;y++){const p=Math.round(P(y-2026)*100);bars.push({y:String(y).slice(2),p,h:Math.max(3,Math.round(p*0.98))});}return{t50,p2031:Math.round(P(5)*100),p2036:Math.round(P(10)*100),bars};}
const tierOf=r=>r.p2036>=60?'high':(r.p2036>=25?'mid':'low');

function initial(){return{screen:'input',tab:'home',query:'',occ:null,notFound:false,bump:0,shared:false,
  target:null, compassFilter:'fit',
  save:{on:false,pct:8,roundup:false,balance:0,insurance:false},
  learn:{started:false,done:0,streak:0},
  job:{resume:false,applied:[],invited:false,prepared:false,offer:false,salaryMoved:false},
  agent:[],agentWeek:0,agentSaved:0,push:null,toast:null,returns:0,log:[],weeks:0};}
let S=initial();

function occ(){return O[S.occ||'buh'];}
function tgt(){return S.target&&S.target!=='stay'?O[S.target]:null;}
function goalName(){const t=tgt();return t?t.name:('Сильнее в профессии «'+occ().name+'»');}
function coursePrice(){const t=tgt();return t?t.price:40000;}
function cushionTarget(){const t=tierOf(risk(occ(),S.bump));return (t==='high'?4:(t==='mid'?3:2))*EXPENSES;}
function score(){
  const r=risk(occ(),S.bump);
  let s=Math.round(20*(1-r.p2036/100));
  if(S.target) s+=10;
  s+=Math.round(22*Math.min(1,S.save.balance/cushionTarget()));
  if(S.save.insurance) s+=3;
  s+=Math.round(30*S.learn.done/LESSONS);
  const j=S.job; s+=Math.round(15*((j.resume?1:0)+(j.applied.length?1:0)+(j.invited&&j.prepared?1:0)+(j.offer?1:0))/4);
  return Math.min(100,s);
}
const LEVELS=[[0,'Уязвим','#FF8A80'],[30,'Готовлюсь','#FFC46B'],[55,'Защищён','#7EDB9C'],[80,'Востребован','#8EC5FF']];
function level(s){let L=LEVELS[0],N=null;for(let i=0;i<LEVELS.length;i++){if(s>=LEVELS[i][0]){L=LEVELS[i];N=LEVELS[i+1]||null;}}return{name:L[1],color:L[2],from:L[0],next:N};}

function nextStep(){
  const j=S.job;
  if(!S.target) return {t:'Выберите профессию будущего',d:'Компас покажет, куда засчитается ваш опыт и где риск ниже',act:'tab',arg:'compass',pts:10};
  if(!S.save.on) return {t:'Включите копилку перехода',d:'Подушка на время смены работы копится сама с каждой зарплаты',act:'tab',arg:'save',pts:'до 22'};
  if(!S.learn.started) return {t:'Начните обучение',d:'Курс «'+goalName()+'» — оплата частями, пока учитесь',act:'tab',arg:'learn',pts:4};
  if(!j.resume) return {t:'Соберите резюме под новую профессию',d:'Агент перенесёт опыт из текущей работы за минуту',act:'tab',arg:'job',pts:4};
  if(S.learn.done<4) return {t:'Урок '+(S.learn.done+1)+' из '+LESSONS,d:'40 минут — и +4 к защищённости',act:'tab',arg:'learn',pts:4};
  if(j.applied.length<2) return {t:'Откликнитесь на 2 вакансии',d:'Проверьте рынок, пока у вас есть работа',act:'tab',arg:'job',pts:4};
  if(j.invited&&!j.prepared) return {t:'Подготовьтесь к собеседованию',d:'Тренировка с ИИ-интервьюером — 15 минут',act:'tab',arg:'job',pts:4};
  if(j.invited&&!j.offer) return {t:'Пройдите собеседование',d:'Вас ждут в пятницу, 15:00',act:'tab',arg:'job',pts:4};
  if(j.offer&&!j.salaryMoved) return {t:'Получайте новую зарплату в Сбер',d:'Копилка, кредит и план уже здесь',act:'tab',arg:'job',pts:0};
  if(S.learn.done<LESSONS) return {t:'Урок '+(S.learn.done+1)+' из '+LESSONS,d:'Закончите курс — получите сертификат',act:'tab',arg:'learn',pts:4};
  return {t:'Вы защищены',d:'Следим за риском профессии и пересчитываем раз в квартал',act:'tab',arg:'home',pts:0};
}

 return sets[i].map((x,j)=>({id:i+'-'+j+'-'+Date.now(),text:x[0],saving:x[1],status:'pending'}));}

function vResult(){
  const o=occ(),r=risk(o,S.bump),tier=tierOf(r);
  const byW=o.tasks.slice().sort((a,b)=>b.w-a.w),top=byW[0],human=byW[byW.length-1];
  const years=Math.max(1,Math.round(r.t50));
  const when=r.t50>20?'более 20 лет':('через ~'+years+' '+plural(years,'год','года','лет')+' ('+(2026+years)+')');
  const tierLabel=tier==='high'?'Высокий риск':(tier==='mid'?'Средний риск':'Низкий риск');
  const tierBg=tier==='high'?'var(--redSoft)':(tier==='mid'?'var(--amberSoft)':'var(--greenSoft)');
  const scoreC=tier==='high'?'#FF8A80':(tier==='mid'?'#FFC46B':'#7EDB9C');
  const verdict=tier==='high'?'ИИ уже уверенно делает «'+top.name+'» — около '+top.w+'% этой части работы. Профессию не отменят за один день, но людей в ней будут сокращать раньше: переходить лучше заранее, пока есть доход.'
   :(tier==='mid'?'ИИ заберёт рутину — «'+top.name+'», но «'+human.name+'» останется за человеком. Кто освоит ИИ-инструменты, станет ценнее; кто нет — будет конкурировать с ИИ по цене.'
   :'Работа руками и с людьми: ИИ здесь помощник, а не замена. «'+human.name+'» останется за вами надолго. Рутину вроде «'+top.name+'» можно отдать ИИ уже сейчас.');
  const others=POPULAR.filter(k=>k!==o.key).slice(0,6);

  return '<div class="score"><span style="color:#C9CED2;font-size:13px">Риск замены ИИ для профессии</span><strong style="font-size:20px">'+esc(o.name)+'</strong>'+
   '<div class="big" style="color:'+scoreC+'">'+r.p2036+'%</div><span style="color:#D0D5D9;font-size:14px">вероятность, что ИИ заберёт бо́льшую часть работы в ближайшие 10 лет</span><span style="color:#9AA1A7;font-size:13px">к 2031 — '+r.p2031+'%</span>'+
   '<div class="pills"><span class="pill" style="background:'+tierBg+';color:'+riskCol(r.p2036)+'">'+tierLabel+'</span><span class="pill" style="background:var(--dark2);color:#fff">Точка 50%: '+when+'</span></div></div>'+
  '<div class="card"><span class="eyebrow" style="color:'+riskCol(r.p2036)+'">Вердикт</span><div>'+esc(verdict)+'</div></div>'+

  '<div class="grid2">'+
   [['compass','Компас','Куда перейти с вашим опытом'],['save','Копилка','Подушка на время перехода'],['learn','Обучение','Курс с оплатой частями'],['job','Работа','Резюме, отклики, оффер']].map(x=>'<button class="tile" data-act="toHubTab" data-arg="'+x[0]+'">'+svg(x[0],'#137A3F')+'<span class="t">'+x[1]+'</span><span class="hint">'+x[2]+'</span></button>').join('')+'</div>'+

  '<div class="card"><strong>Что уйдёт к ИИ первым</strong>'+byW.map(t=>'<div style="display:flex;flex-direction:column;gap:6px"><div class="row" style="font-size:14px"><span>'+esc(t.name)+'</span><b style="color:'+riskCol(t.w)+'">'+t.w+'%</b></div><div class="track"><i style="width:'+t.w+'%;background:'+riskCol(t.w)+'"></i></div></div>').join('')+'</div>'+

  '<p class="hint" style="font-size:11px;padding:0 4px">Модель: доля автоматизируемых задач профессии × скорость внедрения ИИ в отрасли. Оценка для профессии, а не для вас лично. Пересчёт раз в квартал. Демо-коэффициенты.</p>';
}

function vCompass(){
  const o=occ();
  const fitMap={};o.targets.forEach(t=>fitMap[t.key]=t.fit);
  let keys=Object.keys(O).filter(k=>k!==o.key);
  if(S.compassFilter==='fit') keys=keys.filter(k=>fitMap[k]);

  const dem=d=>d==='↑'?'<span class="tag g">Спрос растёт</span>':(d==='→'?'<span class="tag">Спрос стабилен</span>':'<span class="tag r">Спрос падает</span>');
  return '<div class="card" style="background:var(--dark);color:#fff"><span class="eyebrow" style="color:#7EDB9C">Компас профессий будущего</span><strong style="font-size:18px">Куда перейти из профессии «'+esc(o.name)+'»</strong><span style="font-size:13px;color:#C9CED2">Сортировка: ниже риск ИИ, выше спрос, больше засчитается вашего опыта</span></div>'+
   '<div class="chips"><button class="chip'+(S.compassFilter==='fit'?' on':'')+'" data-act="cfilter" data-arg="fit">Подходят мне</button><button class="chip'+(S.compassFilter==='all'?' on':'')+'" data-act="cfilter" data-arg="all">Все профессии</button></div>'+
   '<button class="card tap" data-act="setTarget" data-arg="stay"'+(S.target==='stay'?' style="box-shadow:0 0 0 2px var(--green) inset"':'')+'><div class="row"><strong>Остаться и усилиться</strong>'+(S.target==='stay'?'<span class="tag g">Ваша цель</span>':'')+'</div><span class="hint">ИИ-инструменты в текущей работе и курс, который поднимает ставку</span></button>'+
   list.map(i=>'<div class="card"><div class="row"><strong style="font-size:16px">'+esc(i.x.name)+'</strong>'+(S.target===i.k?'<span class="tag g">Ваша цель</span>':'')+'</div>'+
     '<div class="tags"><span class="tag '+riskTag(i.p)+'">Риск ИИ: '+i.p+'%</span>'+dem(i.x.demand)+'<span class="tag b">от '+fmt(i.x.pay)+'</span><span class="tag">Опыт засчитается ~'+i.fit+'%</span></div>'+
     '<span class="hint">Обучение: '+i.x.course+' мес. · '+fmt(i.x.price)+' · частями от '+fmt(Math.round(i.x.price*0.025/10)*10)+'/мес</span>'+
     (S.target===i.k?'':'<button class="btn outline sm" style="width:100%" data-act="setTarget" data-arg="'+i.k+'">Выбрать целью</button>')+'</div>').join('');
}

function goScreen(sc,tab){S.screen=sc;if(tab)S.tab=tab;S.push=null;render(sc==='input');const n=document.getElementById('scroll');if(n)n.scrollTop=0;}

function openResult(k){S.occ=k;S.query=O[k].name;S.target=null;S.bump=0;S.notFound=false;S.shared=false;
  S.save={on:false,pct:8,roundup:false,balance:0,insurance:false};S.learn={started:false,done:0,streak:0};S.job={resume:false,applied:[],invited:false,prepared:false,offer:false,salaryMoved:false};S.agent=[];
  addLog('Проверка','«'+O[k].name+'»: риск за 10 лет '+risk(O[k],0).p2036+'%');goScreen('result');}
function doCalc(){const m=match(S.query);if(m.length===1)return openResult(m[0]);if(m.length>1){const ex=m.find(k=>norm(O[k].name)===norm(S.query));if(ex)return openResult(ex);S.notFound=false;}else S.notFound=true;
  const nf=document.getElementById('nf');if(nf)nf.hidden=!S.notFound;const sg=document.getElementById('sugg');if(sg)sg.innerHTML=suggestHtml();}

function ensureBasics(){ if(!S.occ){S.occ='buh';} if(S.screen==='input'||S.screen==='result'){S.screen='hub';} if(!S.target){const r=risk(occ(),S.bump);S.target=tierOf(r)==='low'?'stay':occ().targets[0].key;} if(!S.save.on) S.save.on=true; if(!S.agent.length) S.agent=agentSet(0); }
function fire(kind){
  mutate(()=>{
    ensureBasics(); let p;
    if(kind==='week'){S.agentWeek=(S.agentWeek+1)%3;S.agent=agentSet(S.agentWeek);S.weeks++;
      p={tag:'Неделя',title:'Агент подготовил 3 шага, урок '+Math.min(S.learn.done+1,LESSONS)+' ждёт',body:'Подтвердите шаги и пройдите урок — защищённость вырастет. Без вашего «да» агент ничего не делает.',tab:'home'};}
    else if(kind==='salary'){const add=Math.round(SALARY*S.save.pct/100/10)*10+(S.save.roundup?600:0);S.save.balance+=add;const ct=cushionTarget();
      p={tag:'Зарплата',title:'Пришла зарплата 98 400 ₽',body:fmt(add)+' ушло в копилку перехода. Там уже '+fmt(S.save.balance)+' — '+Math.min(100,Math.round(S.save.balance/ct*100))+'% подушки.',tab:'save'};}
    else if(kind==='market'){const v=vacancies()[0];p={tag:'Рынок',title:'+18 вакансий «'+goalName()+'» за месяц',body:'Лучшая: '+v.title+', '+fmt(v.pay)+'. Откликнитесь, пока работаете.',tab:'job'};}
    else if(kind==='risk'){const b=risk(occ(),S.bump),a=risk(occ(),S.bump+0.04);S.bump+=0.04;p={tag:'Пересчёт риска',title:'«'+occ().name+'»: риск за 10 лет '+b.p2036+'% → '+a.p2036+'%',body:'Точка 50% сдвинулась: '+monthLabel(Math.round(b.t50*12))+' → '+monthLabel(Math.round(a.t50*12))+'. Проверьте, успевает ли ваш трек.',tab:'home'};}
    S.push=p;addLog(p.tag,p.title);
  });
}

 lesson:()=>mutate(()=>{S.learn.done=Math.min(LESSONS,S.learn.done+1);S.learn.streak=Math.max(S.learn.streak,1)+(S.learn.done>1?1:0);addLog('Урок',S.learn.done+' из '+LESSONS);}),
 resume:()=>mutate(()=>{S.job.resume=true;addLog('Резюме','Агент собрал резюме под «'+goalName()+'»');}),
 apply:id=>mutate(()=>{if(S.job.applied.indexOf(id)<0)S.job.applied.push(id);addLog('Отклик','Отправлен');if(S.job.applied.length>=2&&!S.job.invited){S.job.invited=true;S.push={tag:'Работа',title:'Вас пригласили на собеседование',body:'Пятница, 15:00. Пройдите тренировку с ИИ-интервьюером — 15 минут.',tab:'job'};addLog('Работа','Приглашение на собеседование');}}),
 prepare:()=>mutate(()=>{S.job.prepared=true;addLog('Тренировка','ИИ-интервьюер: 8 из 10');}),
 interview:()=>mutate(()=>{S.job.offer=true;addLog('Оффер','Переход до точки риска');}),
 moveSalary:()=>mutate(()=>{S.job.salaryMoved=true;addLog('Удержание','Новая зарплата будет приходить в Сбер');},{toast:'Зарплата остаётся в Сбере'}),
 approve:id=>agentAct(id,'done'), decline:id=>agentAct(id,'declined'),
 share:()=>{const r=risk(occ(),S.bump);const text='Мой риск замены ИИ — «'+occ().name+'»: '+r.p2036+'% за 10 лет. Проверь свою профессию в СберБанк Онлайн';try{navigator.clipboard.writeText(text).catch(()=>{});}catch(e){}S.shared=true;addLog('Поделился','Друг проверит свою профессию в Сбере');render(false);},
 openPush:()=>{const t=S.push&&S.push.tab;S.returns++;S.push=null;S.screen='hub';S.tab=t||'home';render(false);const n=document.getElementById('scroll');if(n)n.scrollTop=0;},
 dismissPush:()=>{S.push=null;render(false);},
 fire:k=>fire(k),
 reset:()=>{S=initial();render(true);}
};
function agentAct(id,status){mutate(()=>{const a=S.agent.find(x=>x.id===id);if(!a)return;a.status=status;if(status==='done'){S.agentSaved+=a.saving;if(/резюме/i.test(a.text))S.job.resume=true;}addLog('Агент',(status==='done'?'Подтверждено: ':'Отклонено: ')+a.text);},{toast:status==='done'?'Агент сделал':'Агент учтёт'});}

document.addEventListener('click',e=>{const el=e.target.closest('[data-act]');if(!el||el.disabled)return;const f=ACT[el.dataset.act];if(f)f(el.dataset.arg);});
document.addEventListener('input',e=>{if(e.target.id!=='prof-input')return;S.query=e.target.value;S.notFound=false;const nf=document.getElementById('nf');if(nf)nf.hidden=true;const sg=document.getElementById('sugg');if(sg)sg.innerHTML=suggestHtml();});
document.addEventListener('keydown',e=>{if(e.target.id==='prof-input'&&e.key==='Enter'){e.preventDefault();doCalc();}});
render(true);
})();
</script>
</body>
</html>
